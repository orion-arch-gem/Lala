<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch Rhythm Game GIF Moving</title>
    <style>
        body {
            background: #0f0f13;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 560px;
            height: 220px;
            margin: 5px auto;
        }
        canvas {
            background: #15151c;
            border: 2px solid #333;
            display: block;
            touch-action: none;
        }
        /* Menggunakan transisi halus agar animasi GIF di browser tidak ter-reset terus */
        #playerGif {
            position: absolute;
            width: 55px;
            height: 55px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            object-fit: contain;
            will-change: top, left;
        }
        #scoreText {
            font-size: 12px;
            font-weight: bold;
            margin-top: 2px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="560" height="220"></canvas>
        <img id="playerGif" src="lala.gif" alt="GIF Karakter">
    </div>

    <div id="scoreText">Skor: 0 | Status: Siap Geser!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        const playerGif = document.getElementById("playerGif");

        let score = 0;
        let statusText = "Geser jempolmu ke atas/bawah!";
        
        const targetX = 460;

        let player = {
            x: targetX,
            y: 110,
            size: 30
        };

        let note = {
            x: -20,
            y: 110,
            radius: 14,
            speed: 4,
            active: true
        };

        function updateTouch(clientY) {
            let rect = canvas.getBoundingClientRect();
            let scaleY = canvas.height / rect.height;
            let touchY = (clientY - rect.top) * scaleY;
            
            player.y = touchY;
            limitPlayerY();
        }

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            updateTouch(e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            updateTouch(e.touches[0].clientY);
        }, { passive: false });
        
        canvas.addEventListener("mousemove", (e) => {
            updateTouch(e.clientY);
        });

        function limitPlayerY() {
            if (player.y < 25) player.y = 25;
            if (player.y > canvas.height - 25) player.y = canvas.height - 25;
        }

        function update() {
            if (note.active) {
                note.x += note.speed;

                let distanceX = Math.abs(note.x - targetX);
                let distanceY = Math.abs(note.y - player.y);

                if (distanceX <= 16 && distanceY <= 30) {
                    score += 100;
                    statusText = "✨ PERFECT!";
                    note.active = false;
                    setTimeout(resetNote, 400);
                }

                if (note.x > targetX + 40) {
                    statusText = "❌ MISS!";
                    note.active = false;
                    setTimeout(resetNote, 400);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(targetX, 15);
            ctx.lineTo(targetX, canvas.height - 15);
            ctx.stroke();
            ctx.setLineDash([]);

            let rect = canvas.getBoundingClientRect();
            let scaleX = rect.width / canvas.width;
            let scaleY = rect.height / canvas.height;

            // Update posisi GIF secara langsung
            playerGif.style.left = (player.x * scaleX) + "px";
            playerGif.style.top = (player.y * scaleY) + "px";

            if (note.active) {
                ctx.fillStyle = "#2ecc71";
                ctx.beginPath();
                ctx.arc(note.x, note.y, note.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(note.x, note.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            scoreText.innerHTML = `Skor: <span style="color:#2ecc71">${score}</span> | Status: ${statusText}`;
        }

        function resetNote() {
            note.x = -20; 
            const lanes = [45, 110, 175];
            note.y = lanes[Math.floor(Math.random() * lanes.length)];
            note.active = true;
            statusText = "Geser terus...";
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
