<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch Rhythm Game Animation Frames</title>
    <style>
        body {
            background: #0f0f13;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        canvas {
            background: #15151c;
            border: 2px solid #333;
            display: block;
            margin: 5px auto;
            touch-action: none;
        }
        #scoreText {
            font-size: 12px;
            font-weight: bold;
            margin-top: 2px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="560" height="220"></canvas>
    <div id="scoreText">Skor: 0 | Status: Memuat Animasi...</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");

        let score = 0;
        let statusText = "Geser jempolmu ke atas/bawah!";
        
        const targetX = 460;

        let player = {
            x: targetX,
            y: 110,
            size: 45
        };

        // --- SISTEM PEMUTAR ANIMASI FRAME (23 FRAME) ---
        const totalFrames = 23; 
        let frames = [];
        let currentFrameIndex = 0;
        let framesLoadedCount = 0;

        for (let i = 0; i < totalFrames; i++) {
            let img = new Image();
            // Menyesuaikan penamaan otomatis dari ezgif (frame_00, frame_01, dst.)
            let numStr = i < 10 ? "0" + i : i;
            img.src = `frame_${numStr}_delay-0.07s.gif`; 
            
            img.onload = function() {
                framesLoadedCount++;
                if (framesLoadedCount === totalFrames) {
                    statusText = "Geser terus...";
                }
            };
            frames.push(img);
        }

        // Kecepatan putar animasi frame
        setInterval(() => {
            if (frames.length > 0) {
                currentFrameIndex = (currentFrameIndex + 1) % totalFrames;
            }
        }, 70);
        // -----------------------------------

        let note = {
            x: -20,
            y: 110,
            radius: 14,
            speed: 4,
            active: true
        };

        function updateTouch(clientY) {
            let rect = canvas.getBoundingClientRect();
            let scaleY = canvas.height / rect.height;
            let touchY = (clientY - rect.top) * scaleY;
            
            player.y = touchY;
            limitPlayerY();
        }

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            updateTouch(e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            updateTouch(e.touches[0].clientY);
        }, { passive: false });
        
        canvas.addEventListener("mousemove", (e) => {
            updateTouch(e.clientY);
        });

        function limitPlayerY() {
            if (player.y < 25) player.y = 25;
            if (player.y > canvas.height - 25) player.y = canvas.height - 25;
        }

        function update() {
            if (note.active) {
                note.x += note.speed;

                let distanceX = Math.abs(note.x - targetX);
                let distanceY = Math.abs(note.y - player.y);

                if (distanceX <= 16 && distanceY <= 30) {
                    score += 100;
                    statusText = "✨ PERFECT!";
                    note.active = false;
                    setTimeout(resetNote, 400);
                }

                if (note.x > targetX + 40) {
                    statusText = "❌ MISS!";
                    note.active = false;
                    setTimeout(resetNote, 400);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Garis Penerima (Hit Zone)
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(targetX, 15);
            ctx.lineTo(targetX, canvas.height - 15);
            ctx.stroke();
            ctx.setLineDash([]);

            // Gambar animasi frame secara bergantian di canvas
            if (frames.length > 0 && frames[currentFrameIndex].complete) {
                ctx.drawImage(
                    frames[currentFrameIndex], 
                    player.x - player.size/2, 
                    player.y - player.size/2, 
                    player.size, 
                    player.size
                );
            }

            // Gambar Note berjalan
            if (note.active) {
                ctx.fillStyle = "#2ecc71";
                ctx.beginPath();
                ctx.arc(note.x, note.y, note.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(note.x, note.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            scoreText.innerHTML = `Skor: <span style="color:#2ecc71">${score}</span> | Status: ${statusText}`;
        }

        function resetNote() {
            note.x = -20; 
            const lanes = [45, 110, 175];
            note.y = lanes[Math.floor(Math.random() * lanes.length)];
            note.active = true;
            statusText = "Geser terus...";
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
